<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analytics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0D10;color:#ECEAE4;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:22px 16px 10px">
    <button type="button" style="height:40px;padding:0 6px;background:none;border:0;color:#E8B04B;font:500 15px 'IBM Plex Sans',sans-serif">‹ Control</button>
    <div style="font-size:24px;font-weight:600;margin-top:4px">Analytics</div>
  </div>

  <div style="padding:0 20px 12px">
    <div role="tablist" aria-label="Time range" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#0F1217;border:1px solid #2A2F3A;border-radius:12px;padding:4px">
      <button type="button" role="tab" aria-selected="true" style="height:40px;border-radius:9px;background:#E8B04B;border:0;color:#1A1408;font:600 14px 'IBM Plex Sans',sans-serif">7 days</button>
      <button type="button" role="tab" aria-selected="false" style="height:40px;border-radius:9px;background:transparent;border:0;color:#A9AEB8;font:500 14px 'IBM Plex Sans',sans-serif">30 days</button>
      <button type="button" role="tab" aria-selected="false" style="height:40px;border-radius:9px;background:transparent;border:0;color:#A9AEB8;font:500 14px 'IBM Plex Sans',sans-serif">90 days</button>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:12px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="background:#14171C;border:1px solid #2A2F3A;border-radius:12px;padding:12px"><div style="font-size:12px;color:#A9AEB8">Tokens</div><div style="font-size:22px;font-weight:600;margin-top:4px">2.1M</div></div>
      <div style="background:#14171C;border:1px solid #2A2F3A;border-radius:12px;padding:12px"><div style="font-size:12px;color:#A9AEB8">Cache hit rate</div><div style="font-size:22px;font-weight:600;margin-top:4px">64%</div></div>
      <div style="background:#14171C;border:1px solid #2A2F3A;border-radius:12px;padding:12px"><div style="font-size:12px;color:#A9AEB8">Estimated cost</div><div style="font-size:22px;font-weight:600;margin-top:4px">$12.40</div></div>
      <div style="background:#14171C;border:1px solid #2A2F3A;border-radius:12px;padding:12px"><div style="font-size:12px;color:#A9AEB8">Sessions</div><div style="font-size:22px;font-weight:600;margin-top:4px">38</div></div>
    </div>

    <div style="background:#14171C;border:1px solid #2A2F3A;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13px;color:#A9AEB8">Tokens per day</div>
      <div role="img" aria-label="Bar chart of tokens per day over 7 days" style="display:flex;align-items:flex-end;gap:8px;height:130px">
        <div style="flex:1;height:58%;background:#3A4150;border-radius:4px 4px 0 0"></div>
        <div style="flex:1;height:72%;background:#3A4150;border-radius:4px 4px 0 0"></div>
        <div style="flex:1;height:40%;background:#3A4150;border-radius:4px 4px 0 0"></div>
        <div style="flex:1;height:88%;background:#E8B04B;border-radius:4px 4px 0 0"></div>
        <div style="flex:1;height:64%;background:#3A4150;border-radius:4px 4px 0 0"></div>
        <div style="flex:1;height:80%;background:#3A4150;border-radius:4px 4px 0 0"></div>
        <div style="flex:1;height:50%;background:#3A4150;border-radius:4px 4px 0 0"></div>
      </div>
      <div aria-hidden="true" style="display:flex;justify-content:space-between;font-size:11px;color:#A9AEB8"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    </div>

    <div style="font-size:12px;font-weight:600;letter-spacing:.06em;color:#A9AEB8">BY MODEL</div>
    <div style="background:#14171C;border:1px solid #2A2F3A;border-radius:14px;overflow:hidden;font-size:14px">
      <div style="display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:6px;padding:10px 12px;color:#A9AEB8;font-size:12px;border-bottom:1px solid #2A2F3A"><span>Model</span><span style="text-align:right">Tokens</span><span style="text-align:right">Cost</span></div>
      <div style="display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:6px;padding:12px;border-bottom:1px solid #2A2F3A"><span>Nous Portal default</span><span style="text-align:right">1.2M</span><span style="text-align:right">$7.10</span></div>
      <div style="display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:6px;padding:12px;border-bottom:1px solid #2A2F3A"><span>OpenRouter route</span><span style="text-align:right">0.6M</span><span style="text-align:right">$3.80</span></div>
      <div style="display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:6px;padding:12px"><span>Local (Ollama)</span><span style="text-align:right">0.3M</span><span style="text-align:right">$0.00</span></div>
    </div>

    <div style="font-size:12px;color:#A9AEB8;line-height:1.5">Costs are estimates from provider prices. Figures on this screen are sample data.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
