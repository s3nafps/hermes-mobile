<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New bot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
label{font-size:13px;color:#A9AEB8}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0D10;color:#ECEAE4;font-family:'IBM Plex Sans',system-ui,sans-serif;position:relative;overflow:hidden">
  <div aria-hidden="true" style="padding:22px 18px;opacity:.4;display:flex;flex-direction:column;gap:14px">
    <div style="height:40px;width:50%;background:#1C2029;border-radius:10px"></div>
    <div style="height:60px;width:90%;background:#14171C;border-radius:14px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.6)"></div>

  <div role="dialog" aria-label="New bot" style="position:absolute;left:0;right:0;bottom:0;top:52px;background:#14171C;border-top:1px solid #2A2F3A;border-radius:22px 22px 0 0;padding:14px 20px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <div aria-hidden="true" style="width:40px;height:4px;border-radius:2px;background:#3A4150;margin:0 auto"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="width:52px"></span>
      <div style="font-size:18px;font-weight:600">New bot</div>
      <span style="width:52px"></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="nb-name">Name</label>
        <input id="nb-name" type="text" placeholder="e.g. Atlas" style="height:46px;box-sizing:border-box;border-radius:12px;border:1px solid #3A4150;background:#0F1217;color:#ECEAE4;padding:0 14px;font:400 15px 'IBM Plex Sans',sans-serif">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="nb-title">Title</label>
        <input id="nb-title" type="text" placeholder="e.g. Coding agent" style="height:46px;box-sizing:border-box;border-radius:12px;border:1px solid #3A4150;background:#0F1217;color:#ECEAE4;padding:0 14px;font:400 15px 'IBM Plex Sans',sans-serif">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="nb-desc">Description</label>
        <textarea id="nb-desc" rows="2" placeholder="What this bot is for" style="box-sizing:border-box;border-radius:12px;border:1px solid #3A4150;background:#0F1217;color:#ECEAE4;padding:10px 14px;font:400 15px 'IBM Plex Sans',sans-serif;resize:none"></textarea>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="nb-on">Create on</label>
        <select id="nb-on" style="height:46px;box-sizing:border-box;border-radius:12px;border:1px solid #3A4150;background:#0F1217;color:#ECEAE4;padding:0 12px;font:400 15px 'IBM Plex Sans',sans-serif"><option>This machine (local)</option><option>home-server</option></select>
      </div>
    </div>

    <details open style="border-top:1px solid #2A2F3A;padding-top:12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <summary style="font-size:15px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center">Advanced</summary>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:13px;color:#A9AEB8">Start from</div>
        <div style="display:flex;gap:8px">
          <span style="font-size:13px;color:#1A1408;background:#E8B04B;border-radius:999px;padding:8px 12px;font-weight:600">Start fresh</span>
          <span style="font-size:13px;color:#A9AEB8;border:1px solid #2A2F3A;border-radius:999px;padding:8px 12px">Clone from Default</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0">
          <span>Pin a model and provider</span>
          <span aria-hidden="true" style="width:44px;height:26px;border-radius:999px;background:#2A2F3A;position:relative"><span style="position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#A9AEB8"></span></span>
        </div>
        <div style="font-size:12px;color:#A9AEB8;margin-top:-6px">Off: inherits the default model.</div>
        <label for="nb-soul">Persona (SOUL.md)</label>
        <textarea id="nb-soul" rows="3" placeholder="You are a careful code reviewer. Prefer small diffs." style="box-sizing:border-box;border-radius:12px;border:1px solid #3A4150;background:#0F1217;color:#ECEAE4;padding:10px 14px;font:400 14px 'IBM Plex Sans',sans-serif;resize:none"></textarea>
        <div style="display:flex;flex-direction:column;gap:0;border:1px solid #2A2F3A;border-radius:12px;overflow:hidden">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px;border-bottom:1px solid #2A2F3A"><span>Skills</span><span style="color:#A9AEB8;font-size:13px">Choose ›</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px;border-bottom:1px solid #2A2F3A"><span>Toolsets</span><span style="color:#A9AEB8;font-size:13px">Choose ›</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px"><span>MCP servers</span><span style="color:#A9AEB8;font-size:13px">Choose ›</span></div>
        </div>
      </div>
    </details>

    <div style="margin-top:auto;display:grid;grid-template-columns:1fr 2fr;gap:10px">
      <button type="button" style="height:50px;border-radius:12px;background:#1C2029;color:#ECEAE4;border:1px solid #2A2F3A;font:500 15px 'IBM Plex Sans',sans-serif">Cancel</button>
      <button type="button" style="height:50px;border-radius:12px;background:#E8B04B;color:#1A1408;border:0;font:600 15px 'IBM Plex Sans',sans-serif">Create bot</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
