<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0D10;color:#ECEAE4;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:22px 20px 0;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:12px;color:#A9AEB8">Voice · Default profile</div>
      <div style="font-size:17px;font-weight:600">Hermes</div>
    </div>
    <button type="button" aria-label="Close voice mode" style="width:44px;height:44px;border-radius:12px;background:#1C2029;border:1px solid #2A2F3A;color:#ECEAE4;font-size:18px">✕</button>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 20px">
    <div aria-hidden="true" style="width:280px;height:280px;border-radius:50%;border:1px solid #2A2F3A;display:flex;align-items:center;justify-content:center">
      <div style="width:210px;height:210px;border-radius:50%;background:#14171C;border:1px solid #3A4150;display:flex;align-items:center;justify-content:center">
        <div style="width:120px;height:120px;border-radius:50%;background:#E8B04B;display:flex;align-items:center;justify-content:center;color:#1A1408;font-size:40px;font-weight:700">H</div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-end;gap:4px;height:64px" aria-hidden="true">
      <span style="width:4px;height:12px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:22px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:36px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:50px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:28px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:62px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:42px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:20px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:54px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:30px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:16px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:44px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:26px;background:#E8B04B;border-radius:2px"></span>
      <span style="width:4px;height:12px;background:#E8B04B;border-radius:2px"></span>
    </div>

    <div style="text-align:center;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:22px;font-weight:600">Listening…</div>
      <div style="font-size:16px;color:#D7D3C8;line-height:1.5">"Summarize this morning's cron output"</div>
      <div style="font-size:13px;color:#A9AEB8">Hermes will read the answer aloud.</div>
    </div>
  </div>

  <div style="padding:0 20px 16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;background:#14171C;border:1px solid #2A2F3A;border-radius:14px;padding:12px 14px;font-size:14px">
      <span>Read replies aloud</span>
      <span aria-hidden="true" style="width:44px;height:26px;border-radius:999px;background:#E8B04B;position:relative"><span style="position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#1A1408"></span></span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;background:#14171C;border:1px solid #2A2F3A;border-radius:14px;padding:12px 14px;font-size:14px">
      <span>Wake word "Hey Hermes"</span>
      <span aria-hidden="true" style="width:44px;height:26px;border-radius:999px;background:#2A2F3A;position:relative"><span style="position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#A9AEB8"></span></span>
    </div>
  </div>

  <div style="padding:6px 20px 32px;display:flex;justify-content:center;gap:20px;align-items:center">
    <button type="button" aria-label="Mute microphone" style="width:64px;height:64px;border-radius:50%;background:#1C2029;border:1px solid #2A2F3A;color:#ECEAE4;font:500 13px 'IBM Plex Sans',sans-serif">Mute</button>
    <button type="button" aria-label="End voice conversation" style="width:76px;height:76px;border-radius:50%;background:#F0736B;border:0;color:#1A1408;font:700 14px 'IBM Plex Sans',sans-serif">End</button>
    <button type="button" aria-label="Switch to text" style="width:64px;height:64px;border-radius:50%;background:#1C2029;border:1px solid #2A2F3A;color:#ECEAE4;font:500 13px 'IBM Plex Sans',sans-serif">Text</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
